# Prometheus config for the LOCAL test (3 uvicorn processes on the host).
global:
  scrape_interval: 5s          # how often to collect metrics

scrape_configs:
  - job_name: prometheus       # Prometheus watches itself
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aviatickets-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8001", "127.0.0.1:8002", "127.0.0.1:8003"]
