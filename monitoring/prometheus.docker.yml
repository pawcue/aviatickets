# Prometheus config for Docker Compose.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aviatickets-backend
    metrics_path: /metrics
    # Docker DNS returns the IP of every replica for the name "backend".
    # Prometheus re-checks it every 10s, so replicas are found automatically.
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8000
        refresh_interval: 10s
