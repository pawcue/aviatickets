# Nginx config for Docker Compose (mounted as /etc/nginx/conf.d/default.conf).
# Same idea as aviatickets.conf, but the upstream is the Compose service name.

# Docker's built-in DNS server. Needed for the "resolve" parameter below.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream aviatickets_backend {
    zone aviatickets_backend 64k;

    # "backend" is the service name. With 3 replicas Docker DNS returns 3 IPs,
    # and nginx balances between all of them (round-robin).
    # "resolve" makes nginx re-check DNS every 10s, so restarted replicas are found.
    server backend:8000 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Metrics are for Prometheus only (it scrapes the replicas directly), not for the internet
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://aviatickets_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Upstream $upstream_addr always;
    }
}
