services:

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aviatickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aviatickets}
      POSTGRES_DB: ${POSTGRES_DB:-aviatickets}
    volumes:
      - pgdata:/var/lib/postgresql/data     
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aviatickets} -d ${POSTGRES_DB:-aviatickets}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aviatickets}:${POSTGRES_PASSWORD:-aviatickets}@db:5432/${POSTGRES_DB:-aviatickets}
    depends_on:
      db:
        condition: service_healthy            
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata: